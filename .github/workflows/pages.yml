name: Deploy Zola site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6.0.1

      - name: Check out rust-glancer
        uses: actions/checkout@v6.0.1
        with:
          repository: rust-glancer/rust-glancer
          ref: main
          path: rust-glancer

      - name: Install mdBook
        uses: taiki-e/install-action@16b05812d776ae1dfaabc8277e421fb6d2506419 # v2.82.7
        with:
          tool: mdbook@0.5.4

      # Zola copies static files verbatim, so the book becomes /docs/ in the
      # same atomic Pages artifact as the main website.
      - name: Build documentation
        run: mdbook build rust-glancer/docs --dest-dir static/docs

      - name: Build Zola and upload Pages artifact
        uses: getzola/github-pages@066755243e69f508fd1a74739fbf1a65f656c790
        with:
          zola_version: v0.23.3
          # TODO: Re-enable once the website, docs, and extension links are live.
          check_links: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
