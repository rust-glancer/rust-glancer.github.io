<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="810" viewBox="0 0 1360 810" role="img" aria-labelledby="title desc">
  <title id="title">Direct values and output handles</title>
  <desc id="desc">Two ways of reading cached results. Above: a directly returned object contains A, B and C. Deserializing it loads all three, even if the caller only reads B. Below: the returned object contains small handles hA, hB and hC. Deserializing the handles does not load their payloads. Calling hB.value(db) loads and deserializes B on demand, while A and C remain on disk. The drawing illustrates reads of stored results, not execution of the producer query.</desc>
