<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1120" viewBox="0 0 1320 1120" role="img" aria-labelledby="title desc">
  <title id="title">Ajika lifecycle</title>
  <desc id="desc">Declarations register queries. The database starts an operation with a shared context. Queries have their own contexts and frames, and share the operation's memos. Successful work checkpoints into operation, session or persistent retention. Retained work can be reused in later operations.</desc>
