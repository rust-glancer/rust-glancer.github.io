<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1220" viewBox="0 0 1360 1220" role="img" aria-labelledby="title desc">
  <title id="title">Ajika storage</title>
  <desc id="desc">Metadata and identity assignments stay in redb. Small values are inline; larger values are independently readable frames in immutable packs. A write synchronizes pack files before committing records and value locations in redb. Maintenance copies live frames to new packs, commits their updated locations and scan progress, then deletes empty packs.</desc>
