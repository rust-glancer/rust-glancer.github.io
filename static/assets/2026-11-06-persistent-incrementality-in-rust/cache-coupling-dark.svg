  <title id="title">Caching and business logic</title>
  <desc id="desc">Two schematic arrangements of the same components. On the left, business logic and caching are intertwined, with many crossing connections between them. On the right, each is contained behind its own boundary, with a single API connecting them. The illustration contrasts the coupling that must be maintained, rather than measuring computational complexity.</desc>
