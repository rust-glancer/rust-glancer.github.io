{% extends "base.html" %}

{% block title %}{{ page.title }} · {{ config.title }}{% endblock title %}

{% block content %}
  <article class="article">
    <header class="page-heading">
      <h1>{{ page.title }}</h1>
      <time datetime="{{ page.date }}">{{ page.date | date(format="%Y-%m-%d") }}</time>
    </header>
    <div class="prose">
      {{ page.content | safe }}
    </div>
  </article>
  {% if page.extra.code_tabs | default(value=false) %}
    <script src="{{ get_url(path='code-tabs.js', cachebust=true) }}" defer></script>
  {% endif %}
{% endblock content %}
